# 模型 + hyp 单文件；数据集路径由启动参数传入（与 YOLOv5 双 yaml 用法对齐）：
#   python3 train.py --cfg mindyolo_core/configs/yolov5/yolov5n_number_split.yaml \
#     --data /绝对路径/data/number_fullscreen.yaml
# 或 mindyolo_core/train.py：--config ... --dataset-yaml .../number_fullscreen.yaml
__BASE__: [
  './hyp.scratch-low.yaml',
]

per_batch_size: 1
img_size: 640
sync_bn: False

data:
  num_parallel_workers: 1

ms_amp_level: O3
keep_loss_fp32: True

network:
  model_name: yolov5

  depth_multiple: 0.33
  width_multiple: 0.25
  stride: [8, 16, 32]

  anchors:
    - [10,13, 16,30, 33,23]
    - [30,61, 62,45, 59,119]
    - [116,90, 156,198, 373,326]

  backbone:
    [[-1, 1, ConvNormAct, [64, 6, 2, 2]],
     [-1, 1, ConvNormAct, [128, 3, 2]],
     [-1, 3, C3, [128]],
     [-1, 1, ConvNormAct, [256, 3, 2]],
     [-1, 6, C3, [256]],
     [-1, 1, ConvNormAct, [512, 3, 2]],
     [-1, 9, C3, [512]],
     [-1, 1, ConvNormAct, [1024, 3, 2]],
     [-1, 3, C3, [1024]],
     [-1, 1, SPPF, [1024, 5]],
    ]

  head:
    [[-1, 1, ConvNormAct, [512, 1, 1]],
     [-1, 1, Upsample, [None, 2, 'nearest']],
     [[-1, 6], 1, Concat, [1]],
     [-1, 3, C3, [512, False]],

     [-1, 1, ConvNormAct, [256, 1, 1]],
     [-1, 1, Upsample, [None, 2, 'nearest']],
     [[-1, 4], 1, Concat, [1]],
     [-1, 3, C3, [256, False]],

     [-1, 1, ConvNormAct, [256, 3, 2]],
     [[-1, 14], 1, Concat, [1]],
     [-1, 3, C3, [512, False]],

     [-1, 1, ConvNormAct, [512, 3, 2]],
     [[-1, 10], 1, Concat, [1]],
     [-1, 3, C3, [1024, False]],

     [[17, 20, 23], 1, YOLOv5Head, [nc, anchors, stride]],
    ]
